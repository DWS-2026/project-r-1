<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Valoración - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="profile-view.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        
        <div class="border p-4 mb-5 shadow-sm">
            <h3>Editar tu opinión</h3>
            <p class="text-muted">Editando valoración de: "Cómo encontrar el amor"</p>
            <hr>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Título breve:</label>
                    <input type="text" class="form-control" value="Buen consejo, funcionó a la primera">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nota (0 al 10):</label>
                    <input type="number" class="form-control" min="0" max="10" value="9">
                </div>

                <div class="mb-3">
                    <label class="form-label">Tu experiencia:</label>
                    <textarea class="form-control" rows="4">La verdad es que al principio dudaba, pero seguí los pasos y me ha ido bastante bien. Recomendado.</textarea>
                </div>

                <a href="profile-view.html" class="btn btn-success w-100 mb-2">Guardar Cambios</a>
                
                <a href="profile-view.html" class="btn btn-outline-danger w-100">Eliminar Valoración</a>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>
</body>
</html>
