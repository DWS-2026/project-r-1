<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="profile-view.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        
        <div class="border p-4 mb-5 shadow-sm">
            <h3>Editar mis datos</h3>
            <p class="text-muted">Actualiza tu información personal.</p>
            <hr>
            
            <form>
                <div class="mb-4 text-center">
                    <label class="form-label d-block fw-bold text-start">Tu Avatar Actual:</label>
                    <img src="../image/avatar1.jpg" alt="Avatar Actual" class="rounded-circle border mb-3">
                    <input type="file" class="form-control">
                    <div class="form-text">Sube una imagen .jpg o .png para cambiar tu foto.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario:</label>
                    <input type="text" class="form-control" value="FerminAragones">
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico:</label>
                    <input type="email" class="form-control bg-light" value="f.aragones.2023@alumnos.urjc.es" readonly>
                    <div class="form-text text-muted">No puedes modificar tu email.</div>
                </div>

                <hr>
                <h5 class="mb-3">Cambiar Contraseña</h5>

                <div class="mb-3">
                    <label class="form-label">Nueva Contraseña (déjalo en blanco para no cambiar):</label>
                    <input type="password" class="form-control" placeholder="******">
                </div>

                <div class="mb-3">
                    <label class="form-label">Repetir Nueva Contraseña:</label>
                    <input type="password" class="form-control" placeholder="******">
                </div>

                <a href="profile-view.html" class="btn btn-primary w-100">Guardar Cambios</a>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>
</body>
</html>
