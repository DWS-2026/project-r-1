<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="../index.html" class="btn btn-secondary">Catálogo</a>
                <a href="login.html" class="btn btn-outline-dark">Login</a>
                <a href="register.html" class="btn btn-dark active">Registro</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        <div class="border p-4 mb-5">
            <h3 class="text-center">Crear Cuenta Nueva</h3>
            <hr>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario:</label>
                    <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Foto de Perfil (Avatar):</label>
                    <input type="file" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña:</label>
                    <input type="password" class="form-control">
                </div>
                <a href="user-profile.html" class="btn btn-success w-100">Registrarse</a>
            </form>
        </div>
    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>
</body>
</html>
