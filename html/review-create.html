<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escribir Valoración - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="../index.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        
        <div class="border p-4 mb-5">
            <h3>Deja tu opinión</h3>
            <p class="text-muted">Estás valorando: "Cómo encontrar el amor"</p>
            <hr>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Título breve:</label>
                    <input type="text" class="form-control" placeholder="Ej: Me funcionó...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nota (0 al 10):</label>
                    <input type="number" class="form-control" min="0" max="10" placeholder="10">
                </div>

                <div class="mb-3">
                    <label class="form-label">Tu experiencia:</label>
                    <textarea class="form-control" rows="4" placeholder="Cuenta qué te pareció el consejo..."></textarea>
                </div>

                <button class="btn btn-primary w-100">Publicar Valoración</button>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Práctica DWS 2026</p>
    </div>
</body>
</html>
