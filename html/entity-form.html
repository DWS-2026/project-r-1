<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar/Crear Consejo - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="user-profile.html" class="btn btn-danger">Cancelar y Volver</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <div class="border p-4 mb-5">
            <h3>Formulario de Consejo</h3>
            <p class="text-muted">Rellena los datos para vender tu sabiduría.</p>
            <hr>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Título del Consejo:</label>
                    <input type="text" class="form-control" placeholder="Ej: Cómo hacerse rico...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría:</label>
                    <select class="form-select">
                        <option>Amor</option>
                        <option>Dinero</option>
                        <option>Salud</option>
                        <option>Estudios</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (€):</label>
                    <input type="number" class="form-control" placeholder="5.00">
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen de Portada:</label>
                    <input type="file" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Texto Secreto (Solo visible tras pagar):</strong></label>
                    <textarea class="form-control" rows="5" placeholder="Escribe aquí tu consejo..."></textarea>
                </div>

                <button class="btn btn-success w-100 mb-2">Guardar Consejo</button>
                <button class="btn btn-outline-danger w-100">Borrar Consejo</button>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>
</body>
</html>
