<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="advice-detail.html" class="btn btn-danger">Cancelar Compra</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 500px;">
        
        <div class="border p-4 mb-5 shadow-sm">
            <h3 class="text-success mb-3">Pasarela de Pago</h3>
            
            <div class="bg-light p-3 mb-3 border rounded">
                <p class="m-0"><strong>Artículo:</strong> Cómo encontrar el amor</p>
                <p class="m-0"><strong>Total a pagar:</strong> <span class="fs-4">5.00 €</span></p>
            </div>

            <hr>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Titular de la Tarjeta:</label>
                    <input type="text" class="form-control" placeholder="Nombre Apellidos">
                </div>

                <div class="mb-3">
                    <label class="form-label">Número de Tarjeta:</label>
                    <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Caducidad:</label>
                        <input type="text" class="form-control" placeholder="MM/AA">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">CVV:</label>
                        <input type="text" class="form-control" placeholder="123">
                    </div>
                </div>

                <a href="profile-view.html" class="btn btn-success w-100 btn-lg">Pagar y Desbloquear</a>
            </form>
            
            <div class="mt-3 text-center text-muted small">
                <p>🔒 Pago seguro (confia)</p>
            </div>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Práctica DWS 2026</p>
    </div>
</body>
</html>
