<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Consejo - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="profile-view.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <div class="border p-4 mb-5 shadow-sm">
            <h3>Editar Consejo</h3>
            <p class="text-muted">Modifica los datos de tu producto.</p>
            <hr>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Título del Consejo:</label>
                    <input type="text" class="form-control" value="Cómo encontrar el amor fácilmente">
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría:</label>
                    <select class="form-select">
                        <option selected>Amor</option> <option>Dinero</option>
                        <option>Salud</option>
                        <option>Estudios</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (€):</label>
                    <input type="number" class="form-control" value="5.00">
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Imagen de Portada:</label>
                    <div class="mb-2">
                        <img src="../images/consejo.jpg" alt="Imagen actual" class="img-thumbnail" style="height: 150px;">
                        <span class="text-muted ms-2 small">Imagen actual</span>
                    </div>
                    <label class="form-label small text-muted">Subir nueva imagen (opcional):</label>
                    <input type="file" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Texto Secreto (Solo visible tras pagar):</strong></label>
                    <textarea class="form-control" rows="5">A</textarea>
                </div>

                <a href="profile-view.html" class="btn btn-success w-100 mb-2">Guardar Cambios</a>
                
                <a href="profile-view.html" class="btn btn-outline-danger w-100">Eliminar Consejo</a>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>
</body>
</html>
