{{>header}}

<!-- Añadimos el CSS de Quill en la cabecera -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <div class="container" style="max-width: 800px;">
        
        <div class="border p-4 mb-5 mt-4 shadow-sm">
            <h3>Editar Consejo</h3>
            <p class="text-muted">Modifica los datos de tu producto.</p>
            <hr>
            
            {{#consejo}}
            <form id="advice-edit-form" action="/advice-edit/{{id}}" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>

                <div class="mb-3">
                    <label class="form-label">Título del Consejo:</label>
                    <input type="text" name="title" class="form-control" value="{{title}}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría:</label>
                    <input type="text" name="category" class="form-control" value="{{category}}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (€):</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{price}}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Imagen de Portada:</label>
                    <div class="mb-2">
                        <img src="/advice/{{id}}/image" alt="Imagen actual" class="img-thumbnail" style="height: 150px; object-fit: cover;">
                        <span class="text-muted ms-2 small">Imagen actual</span>
                    </div>
                    <label class="form-label small text-muted">Subir nueva imagen (opcional):</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                </div>

                <div class="mb-4 bg-light p-3 border rounded">
                    <label class="form-label text-primary"><strong>📎 Documento Adjunto Extra (Opcional):</strong></label>
                    {{#attachmentName}}
                        <p class="text-success small mb-1">Archivo actual: <strong>{{attachmentName}}</strong></p>
                    {{/attachmentName}}
                    <label class="form-label small text-muted">Subir nuevo archivo (sobrescribirá el anterior):</label>
                    <input type="file" name="attachmentFile" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Texto Secreto (Solo visible tras pagar):</strong></label>
                    
                    <div id="editor-container" style="height: 200px; background-color: white;"></div>
                    
                    <div id="original-text" style="display:none;">{{{secretText}}}</div>

                    <input type="hidden" name="secretText" id="hiddenSecretText">
                </div>

                <button type="submit" class="btn btn-success w-100 mb-2">Guardar Cambios</button>
            </form>
            
            <form action="/advice-delete/{{id}}" method="POST" onsubmit="return confirm('¿Estás seguro de que quieres borrar este consejo?');">
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
                <button type="submit" class="btn btn-outline-danger w-100">Eliminar Consejo</button>
            </form>
            {{/consejo}}

        </div>

    </div>

<!-- Script de Quill -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    var quill = new Quill('#editor-container', {
        theme: 'snow'
    });

    var originalHtml = document.getElementById('original-text').innerHTML;
    quill.root.innerHTML = originalHtml;

    var form = document.querySelector('#advice-edit-form');
    form.onsubmit = function() {
        var secretTextContent = document.querySelector('#hiddenSecretText');
        secretTextContent.value = quill.root.innerHTML;
    };
</script>

{{>footer}}
