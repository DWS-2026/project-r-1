{{>header}}

    <div class="container" style="max-width: 600px;">
        
        <div class="border p-4 mb-5 shadow-sm mt-4 bg-light">
            <h3>Edit my data</h3>
            <p class="text-muted">Update your personal information.</p>
            <hr>
            
            {{#userProfile}}
            <form action="/profile-edit" method="POST">
                
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>

                <div class="mb-4 text-center">
                    <label class="form-label d-block fw-bold text-start">Your Current Avatar:</label>
                    <img src="/image/avatar1.jpg" alt="Current Avatar" class="rounded-circle border mb-2" style="width: 120px;">
                    <div class="form-text text-muted">Custom avatars will be available soon.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Username:</label>
                    <input type="text" name="name" class="form-control" value="{{name}}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address:</label>
                    <input type="email" class="form-control bg-white" value="{{email}}" readonly>
                    <div class="form-text text-muted">You cannot modify your registration email.</div>
                </div>

                <hr>
                <h5 class="mb-3">Change Password</h5>

                <div class="mb-3">
                    <label class="form-label">New Password (leave blank to not change it):</label>
                    <input type="password" name="password" class="form-control" placeholder="Type your new password">
                </div>

                <div class="mb-3">
                    <label class="form-label">Repeat New Password:</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat your new password">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/profile-view" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                </div>
            </form>
            {{/userProfile}}
            
        </div>
    </div>

{{>footer}}
