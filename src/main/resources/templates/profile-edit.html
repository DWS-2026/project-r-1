{{>header}}

    <div class="container" style="max-width: 600px;">
        
        <div class="border p-4 mb-5 shadow-sm mt-4 bg-light">
            <h3>Editar mis datos</h3>
            <p class="text-muted">Actualiza tu información personal.</p>
            <hr>
            
            {{#userProfile}}
            <form action="/profile-edit" method="POST">
                
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>

                <div class="mb-4 text-center">
                    <label class="form-label d-block fw-bold text-start">Tu Avatar Actual:</label>
                    <img src="/image/avatar1.jpg" alt="Avatar Actual" class="rounded-circle border mb-2" style="width: 120px;">
                    <div class="form-text text-muted">Los avatares personalizados estarán disponibles próximamente.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de Usuario:</label>
                    <input type="text" name="nombre" class="form-control" value="{{nombre}}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" class="form-control bg-white" value="{{email}}" readonly>
                    <div class="form-text text-muted">No puedes modificar tu email de registro.</div>
                </div>

                <hr>
                <h5 class="mb-3">Cambiar Contraseña</h5>

                <div class="mb-3">
                    <label class="form-label">Nueva Contraseña (déjalo en blanco para no cambiarla):</label>
                    <input type="password" name="password" class="form-control" placeholder="Escribe tu nueva clave">
                </div>

                <div class="mb-3">
                    <label class="form-label">Repetir Nueva Contraseña:</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Repite tu nueva clave">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/profile-view" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                </div>
            </form>
            {{/userProfile}}
            
        </div>
    </div>

{{>footer}}
