<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar/Crear Consejo - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
    
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="/profile-view" class="btn btn-danger">Cancelar y Volver</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <div class="border p-4 mb-5">
            <h3>Formulario de Consejo</h3>
            <p class="text-muted">Rellena los datos para vender tu sabiduría.</p>
            <hr>
            
            <form id="advice-form" action="/advice-create" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>

                <div class="mb-3">
                    <label class="form-label">Título del Consejo:</label>
                    <input type="text" name="title" class="form-control" placeholder="Ej: Cómo hacerse rico..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría:</label>
                    <select name="category" class="form-select" required>
                        <option value="Amor">Amor</option>
                        <option value="Dinero">Dinero</option>
                        <option value="Salud">Salud</option>
                        <option value="Estudios">Estudios</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (€):</label>
                    <input type="number" name="price" step="0.01" class="form-control" placeholder="5.00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen de Portada (JPG/PNG):</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                </div>

                <div class="mb-4 bg-light p-3 border rounded">
                    <label class="form-label text-primary"><strong>📎 Documento Adjunto Extra (Opcional):</strong></label>
                    <p class="small text-muted mb-2">Puedes añadir un PDF, Excel o Word para aportar valor extra a tu consejo. Este archivo se guardará físicamente en el servidor.</p>
                    <input type="file" name="attachmentFile" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Texto Secreto (Solo visible tras pagar):</strong></label>
                    
                    <div id="editor-container" style="height: 200px; background-color: white;"></div>
                    
                    <input type="hidden" name="secretText" id="hiddenSecretText">
                </div>

                <button type="submit" class="btn btn-success w-100 mb-2">Guardar Consejo</button>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>

    <!-- Quill.js Script -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Escribe aquí tu consejo con texto enriquecido...'
        });

        var form = document.querySelector('#advice-form');
        form.onsubmit = function() {
            var secretTextContent = document.querySelector('#hiddenSecretText');
            secretTextContent.value = quill.root.innerHTML;
        };
    </script>
</body>
</html>
