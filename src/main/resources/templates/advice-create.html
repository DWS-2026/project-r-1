<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit/Create Advice - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
    
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="/profile-view" class="btn btn-danger">Cancel and Return</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <div class="border p-4 mb-5">
            <h3>Advice Form</h3>
            <p class="text-muted">Fill in the details to sell your wisdom.</p>
            <hr>
            
            <form id="advice-form" action="/advice-create" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>

                <div class="mb-3">
                    <label class="form-label">Advice Title:</label>
                    <input type="text" name="title" class="form-control" placeholder="Ex: How to get rich..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category:</label>
                    <select name="category" class="form-select" required>
                        <option value="Love">Love</option>
                        <option value="Money">Money</option>
                        <option value="Health">Health</option>
                        <option value="Studies">Studies</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price (€):</label>
                    <input type="number" name="price" step="0.01" class="form-control" placeholder="5.00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cover Image (JPG/PNG):</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                </div>

                <div class="mb-4 bg-light p-3 border rounded">
                    <label class="form-label text-primary"><strong>📎 Extra Attached Document (Optional):</strong></label>
                    <p class="small text-muted mb-2">You can add a PDF, Excel, or Word to add extra value to your advice. This file will be physically saved on the server.</p>
                    <input type="file" name="attachmentFile" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Secret Text (Only visible after paying):</strong></label>
                    
                    <div id="editor-container" style="height: 200px; background-color: white;"></div>
                    
                    <input type="hidden" name="secretText" id="hiddenSecretText">
                </div>

                <button type="submit" class="btn btn-success w-100 mb-2">Save Advice</button>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>

    <!-- Quill.js Script -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Write your rich text advice here...'
        });

        var form = document.querySelector('#advice-form');
        form.onsubmit = function() {
            var secretTextContent = document.querySelector('#hiddenSecretText');
            secretTextContent.value = quill.root.innerHTML;
        };
    </script>
</body>
</html>
