<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar/Crear Consejo - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            <div class="col-md-8 text-end">
                <a href="/profile-view" class="btn btn-danger">Cancelar y Volver</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <div class="border p-4 mb-5">
            <h3>Formulario de Consejo</h3>
            <p class="text-muted">Rellena los datos para vender tu sabiduría.</p>
            <hr>
            
            <form action="/advice-create" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>

                <div class="mb-3">
                    <label class="form-label">Título del Consejo:</label>
                    <input type="text" name="title" class="form-control" placeholder="Ej: Cómo hacerse rico..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría:</label>
                    <select name="category" class="form-select" required>
                        <option value="Amor">Amor</option>
                        <option value="Dinero">Dinero</option>
                        <option value="Salud">Salud</option>
                        <option value="Estudios">Estudios</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (€):</label>
                    <input type="number" name="price" step="0.01" class="form-control" placeholder="5.00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen de Portada:</label>
                    <input type="file" name="imageFile" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Texto Secreto (Solo visible tras pagar):</strong></label>
                    <textarea name="secretText" class="form-control" rows="5" placeholder="Escribe aquí tu consejo..." required></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100 mb-2">Guardar Consejo</button>
                <button type="button" class="btn btn-outline-danger w-100">Borrar Consejo</button>
            </form>
        </div>

    </div>

    <div class="container-fluid bg-light border-top p-3 text-center">
        <p class="m-0">Buy A Brainwave℠</p>
    </div>
</body>
</html>
