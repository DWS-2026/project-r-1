{{>header}}
    <div class="container">
        <h3>Listado de Consejos</h3>
        <hr>
        <div class="row">
            
            {{#consejos}}
            <div class="col-md-4 mb-3">
                <div class="border p-2 text-center"> 
                    
                    <img src="/advice/{{id}}/image" alt="Foto Consejo" class="img-fluid mb-2" style="height: 200px; object-fit: cover;">
                    
                    <h4>{{title}}</h4>
                    <p>Categoría: {{category}}</p>
                    <p><strong>Precio: {{price}} €</strong></p>
                    
                    <a href="/advice-detail/{{id}}" class="btn btn-success w-100">Ver Detalles</a>
                </div>
            </div>
            {{/consejos}}
            
        </div>
        
        </div>
{{>footer}}
