<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido Secreto - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    {{#consejo}}
    <div class="container text-center p-5 bg-white shadow-lg rounded" style="max-width: 800px;">
        <p class="text-muted text-uppercase mb-2"><small>Consejo desbloqueado: {{title}}</small></p>
        
        <h1 class="display-5 fw-bold text-dark mt-4 mb-5">{{secretText}}</h1>
        
        <div class="mt-5 border-top pt-4">
            <a href="/profile-view" class="btn btn-outline-secondary px-4">Volver a mi perfil</a>
        </div>
    </div>
    {{/consejo}}

    {{^consejo}}
    <div class="text-center">
        <h2 class="text-danger">Error: Contenido no encontrado</h2>
        <a href="/profile-view" class="btn btn-primary mt-3">Volver</a>
    </div>
    {{/consejo}}

</body>
</html>
