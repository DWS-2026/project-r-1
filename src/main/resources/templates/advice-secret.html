<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Content - Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Quill styles to render correctly outside the editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.core.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    {{#advice}}
    <div class="container p-5 bg-white shadow-lg rounded" style="max-width: 800px;">
        <p class="text-center text-muted text-uppercase mb-2"><small>Advice unlocked: {{title}}</small></p>
        
        <div class="ql-editor mt-4 mb-5 text-dark" style="font-size: 1.25rem;">
            {{{secretText}}}
        </div>
        
        <!-- Disk file download area if it exists -->
        {{#attachmentName}}
        <div class="alert alert-info mt-4 text-center">
            <p class="mb-2">This advice includes extra material:</p>
            <a href="/advice/{{id}}/attachment" class="btn btn-primary">
                Download <strong>{{attachmentName}}</strong>
            </a>
        </div>
        {{/attachmentName}}

        <div class="mt-5 border-top pt-4 text-center">
            <a href="/profile-view" class="btn btn-outline-secondary px-4">Return to my profile</a>
        </div>
    </div>
    {{/advice}}

    {{^advice}}
    <div class="text-center">
        <h2 class="text-danger">Error: Content not found</h2>
        <a href="/profile-view" class="btn btn-primary mt-3">Return</a>
    </div>
    {{/advice}}

</body>
</html>
