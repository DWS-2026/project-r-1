{{>header}}

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Administration Panel</h2>
            <span class="badge bg-danger fs-6">God Mode Activated</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="m-0">Registered Users Management</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th class="text-center">Actions</th> </tr>
                    </thead>
                    
                    <tbody>
                        {{#usersList}}
                        <tr>
                            <td>#{{id}}</td>
                            <td class="fw-bold">{{name}}</td>
                            <td>{{email}}</td>
                            <td>
                                {{#roles}}
                                    <span class="badge bg-secondary">{{.}}</span>
                                {{/roles}}
                            </td>
                            <td class="text-center">
                                <a href="/admin/user/{{id}}" class="btn btn-sm btn-primary">Inspect Profile</a>
                                
                                <form action="/admin/user-delete/{{id}}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to BAN this user? All their data will be deleted.');">
                                    <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
                                    <button type="submit" class="btn btn-sm btn-danger">Ban</button>
                                </form>
                            </td>
                        </tr>
                        {{/usersList}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

{{>footer}}
