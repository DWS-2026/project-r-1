<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy A Brainwave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body style="background-color: white;">

    <div class="container-fluid bg-light border-bottom p-3 mb-4">
        <div class="row align-items-center">
            
            <div class="col-md-4">
                <h2 class="m-0">Buy A Brainwave</h2>
            </div>
            
            <div class="col-md-4 text-center">
                {{#logged}}
                    <p class="m-0 fw-bold">Logueado con {{userName}}!</p>
                {{/logged}}
                {{^logged}}
                    <p class="m-0 text-muted">Usuario no logueado</p>
                {{/logged}}
            </div>
            
            <div class="col-md-4 text-end">
                <a href="/" class="btn btn-secondary">Catálogo</a>
                
                {{#logged}}
                    <a href="/profile-view" class="btn btn-primary">Mi Perfil</a>
                {{/logged}}
                
                {{^logged}}
                    <a href="/login" class="btn btn-outline-dark">Login</a>
                    <a href="/register" class="btn btn-dark">Registro</a>
                {{/logged}}
            </div>
            
        </div>
    </div>
