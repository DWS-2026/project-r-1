{{>header}}
    <div class="container mt-4" style="max-width: 600px;">
        <div class="border p-4 mb-5 shadow-sm bg-light">
            <h3>Deja tu opinión</h3>
            {{#consejo}}
            <p class="text-muted">Estás valorando: "<strong>{{title}}</strong>"</p>
            <hr>
            
            <form action="/review-create/{{id}}" method="POST">
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Título breve:</label>
                    <input type="text" name="title" class="form-control" placeholder="Ej: Me funcionó..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nota (0 al 10):</label>
                    <input type="number" name="score" class="form-control" min="0" max="10" placeholder="10" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Tu experiencia:</label>
                    <textarea name="comment" class="form-control" rows="4" placeholder="Cuenta qué te pareció el consejo..." required></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/profile-view" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">Publicar Valoración</button>
                </div>
            </form>
            {{/consejo}}
        </div>
    </div>
{{>footer}}
